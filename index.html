<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="タスク">
  <meta name="theme-color" content="#0c7a6b">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <title>日々のタスク</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <style>
    :root, [data-theme="light"] {
      --accent: #0c7a6b;
      --accent2: #0a6559;
      --header-1: #0b6f63;
      --header-2: #1aa38c;
      --bg: #F0F5F3;
      --card: #FFFFFF;
      --text: #1A2A26;
      --sub: #5A6D68;
      --border: #D4E0DC;
      --tabbar-bg: #FFFFFF;
      --tabbar-border: #D4E0DC;
      --tab-pill-bg: #E8EEEC;
      --soft: #E8F4F0;
      --shadow: 0 8px 24px rgba(20, 36, 33, 0.08);
      --danger: #D1456B;
      --danger-soft: #FDECEE;
      --warn: #A3660A;
      --warn-soft: #FFF3D6;
      --ok: #0c7a6b;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    html[data-theme="dark"] {
      --accent: #3dbaa8;
      --accent2: #7ad4c6;
      --header-1: #0a5c52;
      --header-2: #0c7a6b;
      --bg: #101816;
      --card: #1A2422;
      --text: #E8F2EF;
      --sub: #9AADA8;
      --border: rgba(255,255,255,0.10);
      --tabbar-bg: #1A2422;
      --tabbar-border: rgba(255,255,255,0.10);
      --tab-pill-bg: #25312E;
      --soft: #163832;
      --shadow: 0 8px 24px rgba(0,0,0,0.4);
      --danger: #E78098;
      --danger-soft: #3A1C1A;
      --warn: #E7B169;
      --warn-soft: #3A2E14;
      --ok: #3dbaa8;
      color-scheme: dark;
    }
    * { box-sizing: border-box; min-width: 0; }
    html { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      overflow-x: hidden;
      overflow-wrap: anywhere;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    button, input, select, textarea { font-family: inherit; font-size: 16px; color: inherit; }
    button { cursor: pointer; appearance: none; background: none; border: 0; padding: 0; margin: 0; }
    button, a, input, select, textarea, label { touch-action: manipulation; }
    #app {
      min-height: 100vh;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: calc(96px + var(--safe-b));
      min-width: 0;
    }
    html.kb-open #app { padding-bottom: 16px; }
    .appbar {
      padding: calc(16px + var(--safe-t)) 16px 18px;
      background: linear-gradient(135deg, var(--header-1), var(--header-2));
      color: #fff;
      border-radius: 0 0 20px 20px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .appbar-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .appbar-text { flex: 1; min-width: 0; }
    .appbar h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .appbar p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.9;
      overflow-wrap: anywhere;
    }
    .appbar .icon-btn {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(255,255,255,0.22);
      box-shadow: none;
    }
    .appbar .icon-btn svg { width: 20px; height: 20px; }
    #main { padding: 16px; overflow-x: hidden; min-width: 0; }
    .tab-page { display: none; min-width: 0; }
    .tab-page.active { display: block; }
    .date-line {
      font-size: 13px;
      color: var(--sub);
      margin: 0 0 12px;
    }
    .stats {
      display: flex;
      gap: 10px;
      margin: 0 0 14px;
      min-width: 0;
    }
    .stat {
      flex: 1 1 0;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .stat .k { font-size: 12px; color: var(--sub); }
    .stat .v { font-size: 20px; font-weight: 700; letter-spacing: .02em; overflow-wrap: anywhere; }
    .section-h {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 18px 0 10px;
      min-width: 0;
    }
    .section-h:first-child { margin-top: 0; }
    .section-h h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--sub);
      letter-spacing: .04em;
    }
    .section-h .sub { font-size: 12px; color: var(--sub); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
    }
    .card.padded { padding: 16px; }
    .row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      min-width: 0;
      border-top: 1px solid var(--border);
    }
    .row:first-child { border-top: 0; }
    .grow { flex: 1 1 auto; min-width: 0; }
    .row-title {
      font-size: 15px;
      font-weight: 700;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .row-meta {
      font-size: 13px;
      color: var(--sub);
      margin-top: 2px;
      overflow-wrap: anywhere;
    }
    .check {
      flex: none;
      width: 44px;
      height: 44px;
      margin: -4px 0 -4px -8px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: transparent;
      background: transparent;
      position: relative;
    }
    .check::before {
      content: "";
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--card);
      position: absolute;
    }
    .check svg { width: 14px; height: 14px; position: relative; z-index: 1; }
    .check.on { color: #fff; }
    .check.on::before {
      background: var(--accent);
      border-color: var(--accent);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      padding: 2px 8px;
      border-radius: 8px;
      background: var(--soft);
      color: var(--accent);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip.accent { background: var(--soft); color: var(--accent); }
    .chip.warn { background: var(--warn-soft); color: var(--warn); }
    .chip.danger { background: var(--danger-soft); color: var(--danger); }
    .empty {
      padding: 32px 14px;
      text-align: center;
      color: var(--sub);
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .btn, .primary, .secondary, .danger-btn, .ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }
    .primary {
      background: linear-gradient(135deg, var(--header-1), var(--header-2));
      color: #fff;
      border: none;
    }
    .secondary { background: var(--card); }
    .danger-btn { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
    .ghost { background: transparent; color: var(--sub); border-color: transparent; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .btn-row > * { flex: 1 1 0; min-width: 0; }
    .tiny-btns { display: flex; flex-direction: column; gap: 4px; flex: none; }
    .tiny {
      width: 36px;
      height: 28px;
      border-radius: 10px;
      background: var(--soft);
      color: var(--text);
      display: grid;
      place-items: center;
    }
    .tiny svg { width: 14px; height: 14px; }
    .tiny:disabled { opacity: .35; }
    .drag-handle {
      flex: none;
      width: 40px;
      height: 44px;
      margin: -6px 0 -6px -8px;
      display: grid;
      place-items: center;
      color: var(--sub);
      border-radius: 10px;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .drag-handle svg { width: 18px; height: 18px; }
    .habit-item {
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .habit-item.is-dragging {
      z-index: 40;
      box-shadow: 0 10px 28px rgba(20, 40, 36, 0.18);
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--border);
    }
    html[data-theme="dark"] .habit-item.is-dragging {
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
    .habit-placeholder {
      background: var(--soft);
      padding: 0;
      border-top: 1px solid var(--border);
    }
    html.habit-dragging {
      cursor: grabbing;
      -webkit-user-select: none;
      user-select: none;
    }
    html.habit-dragging,
    html.habit-dragging body {
      overscroll-behavior: none;
      touch-action: none;
    }
    .edit-btn {
      flex: none;
      min-height: 32px;
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 2px;
    }
    .icon-btn {
      flex: none;
      min-height: 36px;
      min-width: 44px;
      padding: 0 10px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .icon-btn svg { width: 18px; height: 18px; }
    nav.tabbar {
      position: fixed;
      left: calc(12px + var(--safe-l));
      right: calc(12px + var(--safe-r));
      bottom: calc(8px + var(--safe-b));
      max-width: 456px;
      margin: 0 auto;
      display: flex;
      gap: 2px;
      height: auto;
      padding: 6px;
      background: var(--tabbar-bg);
      border: 1px solid var(--tabbar-border);
      border-radius: 28px;
      box-shadow: 0 10px 28px rgba(20, 36, 33, 0.16);
      z-index: 200;
    }
    html[data-theme="dark"] nav.tabbar { box-shadow: 0 10px 28px rgba(0,0,0,0.45); }
    nav.tabbar.is-hidden { display: none; }
    .tab-btn {
      flex: 1;
      min-height: 44px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: none;
      border: none;
      border-radius: 20px;
      color: var(--sub);
      padding: 4px 2px;
    }
    .tab-btn svg { width: 22px; height: 22px; flex: none; }
    .tab-btn span {
      font-size: 10.5px;
      line-height: 1.1;
      font-weight: 600;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab-btn.active { background: var(--tab-pill-bg); color: var(--accent); }
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      min-width: 0;
    }
    .cal-nav h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cal-head, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
      min-width: 0;
    }
    .cal-head span {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--sub);
      padding: 4px 0;
    }
    .cal-day {
      aspect-ratio: 1;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 650;
      min-width: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text);
    }
    .cal-day.out { color: var(--sub); opacity: .45; }
    .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
    .cal-day .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
    .cal-day.some .dot { background: var(--warn); }
    .cal-day.all .dot { background: var(--accent); }
    .cal-day.none .dot { background: var(--border); }
    .week-strip {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 4px;
      min-width: 0;
    }
    .week-cell {
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 2px 7px;
      text-align: center;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .week-cell.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
    .week-cell .wd { font-size: 10px; color: var(--sub); font-weight: 700; }
    .week-cell .dn { font-size: 14px; font-weight: 700; }
    .week-cell .mark {
      margin: 4px auto 0;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border);
    }
    .week-cell.all .mark { background: var(--accent); }
    .week-cell.some .mark { background: var(--warn); }
    .week-cell.empty .mark { background: transparent; }
    .week-cell.selected { background: var(--soft); border-color: var(--accent); }
    .date-nav { margin-bottom: 8px; }
    .date-nav h2 { font-size: 16px; text-align: center; }
    .back-today-wrap {
      display: flex;
      justify-content: center;
      margin: 0 0 12px;
      min-width: 0;
    }
    .back-today {
      min-height: 36px;
      padding: 0 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      background: var(--soft);
      width: auto;
      max-width: 100%;
    }
    .habit-locked { opacity: 0.45; }
    .habit-locked .row-title,
    .habit-locked .row-meta { color: var(--sub); }
    .habit-locked .check:disabled {
      cursor: default;
      pointer-events: none;
    }
    .row.due-on-view { background: var(--warn-soft); }
    .filter-row {
      display: flex;
      gap: 4px;
      margin: 0 0 12px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .seg {
      flex: 1 1 0;
      min-width: 0;
      min-height: 40px;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      box-shadow: none;
    }
    .seg.on { background: var(--accent); color: #fff; }
    .due-soon { color: var(--warn); font-weight: 700; }
    .due-over { color: var(--danger); font-weight: 700; }
    .banner {
      background: var(--warn-soft);
      color: var(--warn);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }
    .foot-note {
      margin: 20px 0 8px;
      font-size: 12px;
      color: var(--sub);
      text-align: center;
      overflow-wrap: anywhere;
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 16, 15, .45);
      z-index: 240;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    #overlay.show { display: flex; }
    .sheet {
      width: 100%;
      max-width: 520px;
      max-height: min(86dvh, 86vh);
      overflow: auto;
      background: var(--card);
      border-radius: 20px 20px 0 0;
      padding: 16px 16px calc(16px + var(--safe-b));
      min-width: 0;
      box-shadow: var(--shadow);
    }
    html.kb-open .sheet { padding-bottom: 16px; max-height: min(70dvh, 70vh); }
    .sheet h3 { margin: 0 0 12px; font-size: 18px; font-weight: 700; }
    label.fld, .fld { display: block; font-size: 13px; font-weight: 700; color: var(--sub); margin: 12px 0 6px; }
    input[type="text"] {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 16px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 16px;
      outline: none;
      overflow-wrap: anywhere;
      word-break: break-word;
      resize: vertical;
    }
    textarea:focus { border-color: var(--accent); }
    .habit-memo {
      font-size: 13px;
      color: var(--text);
      margin-top: 6px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .memo-link {
      color: var(--accent);
      text-decoration: underline;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .memo-preview {
      font-size: 14px;
      color: var(--text);
      background: var(--soft);
      border-radius: 14px;
      padding: 10px 12px;
      margin: 0 0 12px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .memo-btn {
      flex: none;
      width: 36px;
      height: 36px;
      margin-top: 2px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--sub);
      background: var(--card);
      border: 1px solid var(--border);
    }
    .memo-btn svg { width: 16px; height: 16px; }
    .memo-btn.is-filled {
      color: var(--accent);
      background: var(--soft);
      border-color: var(--accent);
    }
    .choice-grid, .dow-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      min-width: 0;
    }
    .dow-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .choice, .dow {
      min-height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 6px;
    }
    .dow { font-size: 12px; padding: 0; }
    .choice.on, .dow.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(80px + var(--safe-b));
      transform: translateX(-50%) translateY(12px);
      background: var(--text);
      color: var(--bg);
      font-size: 13px;
      font-weight: 650;
      padding: 8px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      z-index: 260;
      max-width: calc(100% - 28px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: opacity .2s, transform .2s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .hidden { display: none !important; }
    @keyframes weekSlide {
      from { transform: translateX(var(--week-slide-x, 24px)); opacity: .92; }
      to { transform: translateX(0); opacity: 1; }
    }
    #page-today.week-anim { animation: weekSlide 200ms ease-out; }
</style>
</head>
<body>
  <div id="app">
    <header class="appbar">
      <div class="appbar-row">
        <div class="appbar-text">
          <h1>日々のタスク</h1>
          <p id="appbarSub">習慣・予定・課題</p>
        </div>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="テーマ切り替え">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>

  function escapeHtml(s) {

  var MEMO_URL_RE = /\bhttps?:\/\/[^\s<>"']+/gi;

    var s = String(text == null ? "" : text);

    var m;

    while ((m = MEMO_URL_RE.exec(s))) {
      var raw = m[0];
      var start = m.index;
      var trail = "";
      while (raw.length && MEMO_TRAIL_CHARS.indexOf(raw.charAt(raw.length - 1)) !== -1) {

      html += escapeHtml(trail);

  }

  function todayDate() { return new Date(); }

  function ymd(d) {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"

  }

  function todayYmd() { return ymd(todayDate()); }

  function parseISO(s) {
    if (!s) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s + "T12:00:00+09:00");
    return new Date(s);
  }

  function ymdToDate(s) { return new Date(s + "T12:00:00+09:00"); }

  function addDays(s, n) {
    var d = ymdToDate(s);
    d.setDate(d.getDate() + n);
    return ymd(d);
  }

  function weekday(s) {
    var map = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    var w = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short" }).format(ymdToDate(s));
    return map[w];
  }

  function monthStart(s) { return s.slice(0, 8) + "01"; }

  function addMonths(s, n) {
    var d = ymdToDate(monthStart(s));
    d.setMonth(d.getMonth() + n);
    return ymd(d).slice(0, 8) + "01";
  }

  function daysInMonth(s) {
    var d = ymdToDate(monthStart(s));
    d.setMonth(d.getMonth() + 1);
    d.setDate(0);

  }

  function formatLongDate(s) {

      timeZone: TZ, year: "numeric", month: "long", day: "numeric"
    }).format(d) + "（" + w + "）";
  }

  function formatShortDate(s) {
    var p = s.split("-");
    return Number(p[1]) + "/" + Number(p[2]) + "（" + DOW_LABELS[weekday(s)] + "）";
  }

  function formatMonthDay(s) {
    var p = s.split("-");
    return Number(p[1]) + "月" + Number(p[2]) + "日（" + DOW_LABELS[weekday(s)] + "）";
  }

  function viewIsToday() { return viewDate === todayYmd(); }

  function headingFor(kind) {
    if (viewIsToday()) return "今日の" + kind;
    return formatMonthDay(viewDate) + "の" + kind;
  }

  function formatTime(d) {
    return new Intl.DateTimeFormat("ja-JP", {
      timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false
    }).format(d);
  }

  function formatDateTime(iso) {
    var d = parseISO(iso);
    if (!d) return "";
    return formatShortDate(ymd(d)) + " " + formatTime(d);
  }

  function applyTheme() {
    var pref = state.themePref || "system";
    var dark = pref === "dark" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme-pref", pref);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#0a5c52" : "#0b6f63");
  }

  function cycleTheme() {
    var order = ["system", "light", "dark"];
    var i = order.indexOf(state.themePref);
    state.themePref = order[(i + 1) % order.length];
    saveState();
    applyTheme();

  }

  function setupViewport() {

    var apply = function () {

  }

  function toast(msg) {

  }

  function habitDays(h) {
    if (h.schedule === "weekdays") return WEEKDAYS.slice();
    if (h.schedule === "weekends") return WEEKENDS.slice();
    if (h.schedule === "custom") return (h.days || []).slice();

  }

  function isScheduled(h, dateStr) {
    if (h.createdAt && dateStr < h.createdAt.slice(0, 10)) return false;
    return habitDays(h).indexOf(weekday(dateStr)) !== -1;
  }

  function isChecked(h, dateStr) {
    return !!(state.checks[h.id] && state.checks[h.id][dateStr]);
  }

  function setChecked(h, dateStr, on) {
    if (!state.checks[h.id]) state.checks[h.id] = {};
    if (on) state.checks[h.id][dateStr] = true;
    else delete state.checks[h.id][dateStr];
    saveState();
  }

  function habitsOn(dateStr) {
    return state.habits.filter(function (h) { return isScheduled(h, dateStr); });
  }

  function dayStatus(dateStr) {
    var hs = habitsOn(dateStr);
    if (!hs.length) return "empty";
    var n = hs.filter(function (h) { return isChecked(h, dateStr); }).length;
    if (n === hs.length) return "all";
    if (n > 0) return "some";

  }

  function streakOf(h) {
    var d = todayYmd();
    if (isScheduled(h, d) && !isChecked(h, d)) d = addDays(d, -1);
    var n = 0;
    for (var i = 0; i < 800; i++) {
      if (h.createdAt && d < h.createdAt.slice(0, 10)) break;
      if (!isScheduled(h, d)) { d = addDays(d, -1); continue; }
      if (isChecked(h, d)) { n += 1; d = addDays(d, -1); }
      else break;
    }
    return n;
  }

  function overallStreak() {
    if (!state.habits.length) return 0;
    var d = todayYmd();
    if (dayStatus(d) !== "all" && habitsOn(d).length) d = addDays(d, -1);
    var n = 0;
    for (var i = 0; i < 800; i++) {
      var st = dayStatus(d);
      if (st === "empty") { d = addDays(d, -1); continue; }
      if (st === "all") { n += 1; d = addDays(d, -1); }
      else break;
    }
    return n;
  }

  function scheduleLabel(h) {

  }

  function eventsOn(dateStr) {

      var s = parseISO(ev.start);

    });
  }

  function eventTitleParts(ev) {

  }

  var CLASS_PREFIX_RE = /^\[授業\]\s*/;

  function cleanCourseTitle(title) {
    var t = String(title || "");
    t = t.replace(CLASS_PREFIX_RE, "");
    t = t.replace(/^〆\s*/, "");
    t = t.replace(CLASS_SLOT_SUFFIX_RE, "");

  }

  var courseNameCache = { data: null, names: null };

  function knownCourseNames() {
    if (courseNameCache.data === DATA) return courseNameCache.names;
    var set = {};
    (DATA.assignments || []).forEach(function (a) {
      if (a.course) set[a.course] = true;

    (DATA.events || []).forEach(function (ev) {
      var t = String(ev.title || "");

      var m = rest.match(CLASS_SLOT_SUFFIX_RE);

      var name = rest.slice(0, rest.length - m[0].length).trim();
      if (name) set[name] = true;

    var names = Object.keys(set);
    names.sort(function (a, b) { return b.length - a.length; });
    courseNameCache = { data: DATA, names: names };
    return names;

  function courseKeyOf(item) {
    if (!item) return "";

    var hay = course + " " + titleRaw + " " + cleanedTitle;
    var names = knownCourseNames();
    for (var i = 0; i < names.length; i++) {
      if (hay.indexOf(names[i]) !== -1) return names[i];

    if (course) return course;
    return cleanedTitle || titleRaw;

  function formatTimeRange(ev, dateStr) {
    if (ev.allDay) return "終日";

  function isAssignmentDone(a) {

  function dueUrgency(a, origin) {

    var n = 0;
    var x = origin;
    while (x < d && n < 400) { x = addDays(x, 1); n += 1; }
    return { kind: n <= 3 ? "soon" : "ok", label: "あと" + n + "日", onView: false };
  }

  function sortedAssignments() {
    return (DATA.assignments || []).slice().sort(function (a, b) {
      var ad = a.due || "9999", bd = b.due || "9999";
      if (ad !== bd) return ad < bd ? -1 : 1;
      return (a.title || "").localeCompare(b.title || "", "ja");

  }

  function upcomingOpen(days, origin) {
    origin = origin || todayYmd();
    var limit = addDays(origin, days);
    return sortedAssignments().filter(function (a) {
      if (isAssignmentDone(a)) return false;
      var d = dueYmd(a);

      return d <= limit;

  }

  function eventWindow() {
    var w = (DATA.sources && DATA.sources.calendarWindow) || {};
    var start = w.start ? parseISO(w.start) : null;
    var end = w.end ? parseISO(w.end) : null;
    if (start && end) return { start: start, end: end };
    var evs = DATA.events || [];
    if (!evs.length) return { start: null, end: null };
    var starts = [];
    var ends = [];
    evs.forEach(function (ev) {
      var s = ev.allDay ? parseISO(ev.start) : parseISO(ev.start);
      var e = ev.allDay ? parseISO(ev.end || ev.start) : (parseISO(ev.end) || s);

      if (e) ends.push(e);

    if (!starts.length) return { start: null, end: null };
    starts.sort(function (a, b) { return a - b; });
    ends.sort(function (a, b) { return a - b; });

  function hasEventData(dateStr) {

  function habitRow(h, dateStr, opts) {
    var on = isChecked(h, dateStr);
    var st = streakOf(h);

      html += '<button type="button" class="check' + (on ? " on" : "") + '" data-act="toggle-habit" data-id="' + escapeHtml(h.id) + '" data-date="' + escapeHtml(dateStr) + '" aria-pressed="' + (on ? "true" : "false") + '" aria-label="' + escapeHtml(h.title) + (on ? " 完了" : " 未完了") + '">' + CHECK_SVG + "</button>";

  function renderToday() {
    var el = document.getElementById("page-today");
    var today = todayYmd();
    if (!viewDate) viewDate = today;
    var day = viewDate;
    var isToday = day === today;
    var isFuture = day > today;
    var locked = isFuture;
    var hs = habitsOn(day);
    var done = hs.filter(function (h) { return isChecked(h, day); }).length;
    var evs = eventsOn(day);
    var hasData = hasEventData(day);
    var asg = upcomingOpen(14, day);
    setAppbarSub(formatLongDate(day));
    var html = "";
    if (dataError) html += '<div class="banner">' + escapeHtml(dataError) + "</div>";

    html += '<div class="cal-nav date-nav">';
    html += '<button type="button" class="icon-btn" data-act="prev-day" aria-label="前の日">' + LEFT_SVG + "</button>";
    html += "<h2>" + escapeHtml(formatMonthDay(day)) + "</h2>";
    html += '<button type="button" class="icon-btn" data-act="next-day" aria-label="次の日">' + RIGHT_SVG + "</button>";
    html += "</div>";
    if (!isToday) {
      html += '<div class="back-today-wrap"><button type="button" class="back-today" data-act="go-today">今日に戻る</button></div>';
    }

    html += '<div class="stats">';
    html += '<div class="stat"><div class="k">' + (isToday ? "今日の習慣" : "この日の習慣") + '</div><div class="v">' + done + " / " + hs.length + "</div></div>";
    html += '<div class="stat"><div class="k">連続達成</div><div class="v">' + overallStreak() + "日</div></div>";
    html += "</div>";

    html += '<div class="week-strip">';
    var start = addDays(day, -weekday(day));
    for (var i = 0; i < 7; i++) {
      var d = addDays(start, i);
      var st = d > today ? "empty" : dayStatus(d);
      var cls = "week-cell " + st;
      if (d === today) cls += " today";
      if (d === day) cls += " selected";
      html += '<button type="button" class="' + cls + '" data-act="select-day" data-date="' + d + '" aria-pressed="' + (d === day ? "true" : "false") + '" aria-label="' + escapeHtml(formatMonthDay(d)) + '">';
      html += '<div class="wd">' + DOW_LABELS[i] + '</div><div class="dn">' + Number(d.slice(8)) + '</div><div class="mark"></div></button>';
    }
    html += "</div>";

    html += '<div class="section-h"><h2>' + escapeHtml(headingFor("習慣")) + "</h2>";
    if (locked && hs.length) html += '<span class="sub">チェックできません</span>';
    html += '</div><div class="card">';
    if (!state.habits.length) {
      html += '<div class="empty">まだ習慣がありません。</div></div>';
      html += '<div class="btn-row"><button type="button" class="primary" data-act="add-habit">習慣を追加</button></div>';
    } else if (!hs.length) {
      html += '<div class="empty">' + (isToday ? "今日は" : "この日は") + "予定されている習慣がありません。</div></div>";
    } else {
      hs.forEach(function (h) { html += habitRow(h, day, { locked: locked }); });
      html += "</div>";
    }

    html += '<div class="section-h"><h2>' + escapeHtml(headingFor("予定")) + '</h2><span class="sub">' + (hasData ? evs.length + "件" : "") + '</span></div><div class="card">';
    if (!hasData) html += '<div class="empty">予定データがありません</div>';
    else if (!evs.length) html += '<div class="empty">' + (isToday ? "今日の予定はありません。" : "この日の予定はありません。") + "</div>";
    if (hasData) {
      evs.forEach(function (ev) { html += eventRow(ev, day); });
    }
    html += "</div>";

    html += '<div class="section-h"><h2>締切が近い課題</h2><span class="sub">14日以内</span></div><div class="card">';
    if (!asg.length) html += '<div class="empty">直近の未提出課題はありません。</div>';
    asg.forEach(function (a) { html += assignmentRow(a, true, day); });
    html += "</div>";
    el.innerHTML = html;
  }

  function assignmentRow(a, compact, origin) {
    var done = isAssignmentDone(a);
    var srcDone = a.sourceStatus === "submitted";
    origin = origin || todayYmd();
    var urg = dueUrgency(a, origin);
    var urgClass = urg.kind === "over" ? "due-over" : urg.kind === "soon" ? "due-soon" : "";
    var key = courseKeyOf(a);
    var memo = key ? getCourseMemo(key) : "";
    var html = '<div class="row' + (urg.onView && !done ? " due-on-view" : "") + '">';
    if (srcDone) {
      html += '<span class="check on" aria-label="提出済み">' + CHECK_SVG + "</span>";
    } else {
      html += '<button type="button" class="check' + (done ? " on" : "") + '" data-act="toggle-assign" data-id="' + escapeHtml(a.id) + '" aria-pressed="' + (done ? "true" : "false") + '">' + CHECK_SVG + "</button>";
    }
    html += '<div class="grow"><div class="row-title">' + escapeHtml(a.title) + "</div>";
    html += '<div class="row-meta">' + escapeHtml(a.course);
    if (a.due) html += " ・ " + escapeHtml(formatDateTime(a.due));
    else if (a.dueLabel) html += " ・ " + escapeHtml(a.dueLabel);
    if (a.inClass) html += " ・ 授業内";
    if (a.dueNote) html += " ・ " + escapeHtml(a.dueNote);
    html += "</div>";
    html += '<div class="chips">';
    if (!srcDone) html += '<span class="chip ' + (urg.kind === "over" ? "danger" : urg.kind === "soon" ? "warn" : "") + ' ' + urgClass + '">' + escapeHtml(urg.label) + "</span>";
    if (srcDone) html += '<span class="chip accent">授業管理で提出済み</span>';
    else if (done) html += '<span class="chip accent">完了にしました</span>';
    html += "</div>";
    if (memo) {
      html += '<div class="habit-memo">' + linkifyMemo(memo) + "</div>";
    }
    html += "</div>";
    if (key) {
      html += '<button type="button" class="memo-btn' + (memo ? " is-filled" : "") + '" data-act="open-course-memo" data-course="' + escapeHtml(key) + '" aria-label="メモ">' + MEMO_SVG + "</button>";
    }
    html += "</div>";
    return html;
  }

  function renderHabits() {
    var el = document.getElementById("page-habits");
    var html = '<div class="section-h"><h2>習慣の一覧</h2><span class="sub">' + state.habits.length + "件</span></div>";
    html += '<div class="card">';
    if (!state.habits.length) html += '<div class="empty">習慣を追加すると、今日のチェックと連続日数が記録されます。</div>';
    state.habits.forEach(function (h) {
      html += '<div class="row habit-item" data-id="' + escapeHtml(h.id) + '">';
      html += '<button type="button" class="drag-handle" aria-label="並べ替え">' + GRIP_SVG + "</button>";
      html += '<div class="grow"><div class="row-title">' + escapeHtml(h.title) + "</div>";
      html += '<div class="row-meta">' + escapeHtml(scheduleLabel(h)) + " ・ 連続" + streakOf(h) + "日</div></div>";
      html += '<button type="button" class="edit-btn" data-act="edit-habit" data-id="' + escapeHtml(h.id) + '">編集</button>';

    html += '<div class="btn-row"><button type="button" class="primary" data-act="add-habit">習慣を追加</button></div>';

  function renderLog() {
    var el = document.getElementById("page-log");
    var start = monthStart(calCursor);
    var y = Number(start.slice(0, 4));
    var m = Number(start.slice(5, 7));
    var dim = daysInMonth(start);
    var firstDow = weekday(start);
    var today = todayYmd();
    var html = '<div class="cal-nav">';
    html += '<button type="button" class="icon-btn" data-act="cal-prev" aria-label="前の月">' + UP_SVG.replace("12 19V5M5 12l7-7 7 7", "15 18l-6-6 6-6") + "</button>";
    html += "<h2>" + y + "年" + m + "月</h2>";
    html += '<button type="button" class="icon-btn" data-act="cal-next" aria-label="次の月">' + DOWN_SVG.replace("12 5v14M19 12l-7 7-7-7", "9 6l6 6-6 6") + "</button>";
    html += "</div>";
    html += '<div class="stats">';
    html += '<div class="stat"><div class="k">連続達成</div><div class="v">' + overallStreak() + "日</div></div>";
    var scheduled = 0, completed = 0;
    for (var day = 1; day <= dim; day++) {
      var ds = start.slice(0, 8) + String(day).padStart(2, "0");
      if (ds > today) continue;
      var hs = habitsOn(ds);
      if (!hs.length) continue;
      scheduled += 1;
      if (dayStatus(ds) === "all") completed += 1;
    }
    html += '<div class="stat"><div class="k">今月の達成日</div><div class="v">' + completed + " / " + scheduled + "</div></div>";
    html += "</div>";
    html += '<div class="card padded">';
    html += '<div class="cal-head">' + DOW_LABELS.map(function (w) { return "<span>" + w + "</span>"; }).join("") + "</div>";
    html += '<div class="cal-grid" id="calGrid">';
    var cells = firstDow + dim;
    var total = Math.ceil(cells / 7) * 7;
    for (var i = 0; i < total; i++) {
      var dayNum = i - firstDow + 1;
      if (dayNum < 1 || dayNum > dim) {
        html += '<div class="cal-day out"></div>';
        continue;
      }
      var d = start.slice(0, 8) + String(dayNum).padStart(2, "0");
      var st = d > today ? "empty" : dayStatus(d);
      html += '<button type="button" class="cal-day ' + st + (d === today ? " today" : "") + '" data-act="open-day" data-date="' + d + '">';
      html += dayNum + '<span class="dot"></span></button>';
    }
    html += "</div></div>";
    html += '<p class="foot-note">色のついた点は、その日の習慣をすべて終えた日（緑）と、一部だけ終えた日（黄）です。未来の日は記録できません。</p>';
    el.innerHTML = html;
  }

  function renderTasks() {
    var el = document.getElementById("page-tasks");
    var all = sortedAssignments();
    var list = all.filter(function (a) {
      if (taskFilter === "open") return !isAssignmentDone(a);
      return true;
    });
    var html = "";
    if (dataError) html += '<div class="banner">' + escapeHtml(dataError) + "</div>";
    html += '<div class="filter-row">';
    html += '<button type="button" class="seg' + (taskFilter === "open" ? " on" : "") + '" data-act="task-filter" data-filter="open">これから</button>';
    html += '<button type="button" class="seg' + (taskFilter === "all" ? " on" : "") + '" data-act="task-filter" data-filter="all">全部</button>';
    html += "</div>";
    html += '<div class="card">';
    if (!all.length) html += '<div class="empty">課題データがまだありません。</div>';
    else if (!list.length) html += '<div class="empty">未提出の課題はありません。</div>';
    list.forEach(function (a) { html += assignmentRow(a, false); });
    html += "</div>";
    var src = DATA.sources || {};
    html += '<p class="foot-note">課題は授業管理の記録、予定はカレンダーの控えから読み込んでいます。';
    if (DATA.generatedAt) html += " データの作成: " + escapeHtml(formatDateTime(DATA.generatedAt)) + "（日本時間）。";
    if (src.assignmentsNote) html += " 課題表の注記: " + escapeHtml(src.assignmentsNote) + "。";
    html += " 完了チェックはこの端末にだけ保存されます。</p>";
    el.innerHTML = html;
  }

  function closeSheet() {
    var ov = document.getElementById("overlay");
    ov.classList.remove("show");
    ov.setAttribute("aria-hidden", "true");
    sheetMode = null;
    editingHabitId = null;
    memoEditingId = null;
    courseMemoEditingKey = null;
    pendingDeleteId = null;
    formDraft = null;
  }

  function openSheet(html, mode) {
    sheetMode = mode;
    document.getElementById("sheet").innerHTML = html;
    var ov = document.getElementById("overlay");
    ov.classList.add("show");
    ov.setAttribute("aria-hidden", "false");
    var focus = document.getElementById("habitName");
    if (focus) setTimeout(function () { focus.focus(); }, 50);
  }

  function openHabitEditor(id) {
    var h = id ? state.habits.filter(function (x) { return x.id === id; })[0] : null;
    editingHabitId = id || null;
    var title = h ? h.title : "";
    var schedule = h ? h.schedule : "daily";
    var days = h ? habitDays(h) : [0, 1, 2, 3, 4, 5, 6];
    var memo = h && typeof h.memo === "string" ? h.memo : "";
    formDraft = { schedule: schedule, days: days.slice() };
    var html = '<h3 id="sheetTitle">' + (h ? "習慣を編集" : "習慣を追加") + "</h3>";

    html += '<label class="fld" for="habitMemo">メモ</label>';
    html += '<textarea id="habitMemo" rows="4" maxlength="2000" placeholder="リンクやメモを書けます">' + escapeHtml(memo) + "</textarea>";
    html += '<div class="fld">繰り返す日</div>';
    html += '<div class="choice-grid" id="habitSchedule">';
    [["daily", "毎日"], ["weekdays", "平日のみ"], ["weekends", "土日のみ"], ["custom", "曜日を指定"]].forEach(function (p) {
      html += '<button type="button" class="choice' + (schedule === p[0] ? " on" : "") + '" data-act="set-schedule" data-value="' + p[0] + '">' + p[1] + "</button>";

  function openConfirmDelete(id) {
    pendingDeleteId = id;

  function openDay(dateStr) {
    if (dateStr > todayYmd()) {

    var hs = habitsOn(dateStr);
    var evs = eventsOn(dateStr);
    var html = '<h3 id="sheetTitle">' + escapeHtml(formatLongDate(dateStr)) + "</h3>";

    openSheet(html, "day");

  function uid() {
    return "h_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function saveHabit() {
    var nameEl = document.getElementById("habitName");
    var title = (nameEl && nameEl.value || "").trim();
    if (!title) { toast("名前を入力してください"); if (nameEl) nameEl.focus(); return; }
    var memoEl = document.getElementById("habitMemo");
    var memo = (memoEl && memoEl.value || "").trim().slice(0, 2000);
    var schedule = formDraft ? formDraft.schedule : "daily";
    var days = formDraft ? formDraft.days.slice() : [0, 1, 2, 3, 4, 5, 6];
    if (schedule === "custom" && !days.length) { toast("曜日を1つ以上選んでください"); return; }
    if (editingHabitId) {
      state.habits.forEach(function (h) {
        if (h.id === editingHabitId) {
          h.title = title;
          h.schedule = schedule;
          h.days = days;
          h.memo = memo;
        }
      });
    } else {
      state.habits.push({
        id: uid(),
        title: title,
        schedule: schedule,
        days: days,
        memo: memo,
        createdAt: new Date().toISOString(),
        order: state.habits.length
      });
    }
    saveState();
    closeSheet();
    render();
    toast("保存しました");
  }

    state.habits = state.habits.filter(function (h) { return h.id !== id; });

    saveState();
    closeSheet();
    render();
    toast("削除しました");

  function moveHabit(id, dir) {
    var i = state.habits.findIndex(function (h) { return h.id === id; });
    var j = i + Number(dir);
    if (i < 0 || j < 0 || j >= state.habits.length) return;
    var tmp = state.habits[i];
    state.habits[i] = state.habits[j];
    state.habits[j] = tmp;
    saveState();
    render();
  }

  function onClick(ev) {
    if (ev.target.closest && ev.target.closest("a.memo-link")) return;
    if (habitDrag.active || habitDrag.suppressClick) {
      habitDrag.suppressClick = false;
      ev.preventDefault();
      ev.stopPropagation();
      return;
    }
    var t = ev.target.closest("[data-act], .tab-btn, #themeBtn");
    if (!t) return;
    if (t.id === "themeBtn") { cycleTheme(); return; }
    if (t.classList.contains("tab-btn")) { switchTab(t.getAttribute("data-tab")); return; }
    var act = t.getAttribute("data-act");
    if (act === "toggle-habit") {
      var hid = t.getAttribute("data-id");
      var date = t.getAttribute("data-date");
      if (date > todayYmd()) return;
      var h = state.habits.filter(function (x) { return x.id === hid; })[0];
      if (!h) return;
      setChecked(h, date, !isChecked(h, date));
      render();
      if (sheetMode === "day") openDay(date);
      return;
    }
    if (act === "toggle-assign") {
      var aid = t.getAttribute("data-id");
      if (state.assignmentDone[aid]) delete state.assignmentDone[aid];
      else state.assignmentDone[aid] = new Date().toISOString();
      saveState();
      render();
      return;
    }
    if (act === "add-habit") { openHabitEditor(null); return; }
    if (act === "edit-habit") { openHabitEditor(t.getAttribute("data-id")); return; }
    if (act === "save-habit") { saveHabit(); return; }
    if (act === "open-memo") { openMemoSheet(t.getAttribute("data-id")); return; }
    if (act === "save-memo") { saveMemo(); return; }
    if (act === "open-course-memo") { openCourseMemoSheet(t.getAttribute("data-course")); return; }
    if (act === "save-course-memo") { saveCourseMemo(); return; }
    if (act === "close-sheet") { closeSheet(); return; }
    if (act === "ask-delete") { openConfirmDelete(t.getAttribute("data-id")); return; }
    if (act === "cancel-delete") { openHabitEditor(t.getAttribute("data-id") || pendingDeleteId); return; }
    if (act === "confirm-delete") { deleteHabit(pendingDeleteId); return; }
    if (act === "move-habit") { moveHabit(t.getAttribute("data-id"), t.getAttribute("data-dir")); return; }
    if (act === "set-schedule") {
      if (!formDraft) return;
      formDraft.schedule = t.getAttribute("data-value");
      if (formDraft.schedule === "weekdays") formDraft.days = WEEKDAYS.slice();
      if (formDraft.schedule === "weekends") formDraft.days = WEEKENDS.slice();
      if (formDraft.schedule === "daily") formDraft.days = [0, 1, 2, 3, 4, 5, 6];
      document.querySelectorAll("#habitSchedule .choice").forEach(function (b) {
        b.classList.toggle("on", b.getAttribute("data-value") === formDraft.schedule);
      });
      var wrap = document.getElementById("dowWrap");
      if (wrap) wrap.classList.toggle("hidden", formDraft.schedule !== "custom");
      return;
    }
    if (act === "toggle-dow") {
      if (!formDraft) return;
      var dow = Number(t.getAttribute("data-dow"));
      var ix = formDraft.days.indexOf(dow);
      if (ix === -1) formDraft.days.push(dow);
      else formDraft.days.splice(ix, 1);
      t.classList.toggle("on");
      return;
    }
    if (act === "open-day") { openDay(t.getAttribute("data-date")); return; }
    if (act === "select-day") { setViewDate(t.getAttribute("data-date")); render(); return; }
    if (act === "prev-day") { setViewDate(addDays(viewDate, -1)); render(); return; }
    if (act === "next-day") { setViewDate(addDays(viewDate, 1)); render(); return; }
    if (act === "go-today") { setViewDate(todayYmd()); render(); return; }
    if (act === "cal-prev") { calCursor = addMonths(calCursor, -1); render(); return; }
    if (act === "cal-next") { calCursor = addMonths(calCursor, 1); render(); return; }
    if (act === "task-filter") { taskFilter = t.getAttribute("data-filter"); render(); return; }
  }

  var swipe = { active: false, decided: false, dx: 0, dy: 0, startX: 0, startY: 0, pointerId: null };
  var habitDrag = {
    active: false,
    pending: false,
    timer: null,
    raf: 0,
    id: null,
    from: 0,
    to: 0,
    startX: 0,
    startY: 0,
    lastX: 0,
    lastY: 0,
    grabOffsetY: 0,
    pointerId: null,
    useTouch: false,
    row: null,
    list: null,
    placeholder: null,
    suppressClick: false,
    suppressTimer: null
  };

  function canStartSwipe(x, target) {
    if (habitDrag.active || habitDrag.pending) return false;
    if (tab !== "today") return false;
    if (sheetMode !== null) return false;
    var overlay = document.getElementById("overlay");
    if (overlay && overlay.classList.contains("show")) return false;
    var ae = document.activeElement;
    if (ae) {
      var tg = ae.tagName;
      if (tg === "INPUT" || tg === "TEXTAREA" || tg === "SELECT" || ae.isContentEditable) return false;
    }
    if (x < 24 || x > window.innerWidth - 24) return false;
    if (target && target.closest && target.closest("#tabbar")) return false;
    if (target && target.closest && (target.closest("a.memo-link") || target.closest("textarea"))) return false;
    return true;
  }

  function resetSwipe() {
    swipe.active = false;
    swipe.decided = false;
    swipe.dx = 0;
    swipe.dy = 0;
    swipe.pointerId = null;
  }

  function trackSwipeMove(x, y) {
    var dx = x - swipe.startX;
    var dy = y - swipe.startY;
    swipe.dx = dx;
    swipe.dy = dy;
    if (!swipe.decided && Math.abs(dx) >= 60 && Math.abs(dx) >= Math.abs(dy) * 1.5) {
      swipe.decided = true;
    }
    return swipe.decided;
  }

  function animateWeekSwitch(delta) {
    var el = document.getElementById("page-today");
    if (!el) return;
    el.style.setProperty("--week-slide-x", delta > 0 ? "28px" : "-28px");
    el.classList.remove("week-anim");
    void el.offsetWidth;
    el.classList.add("week-anim");
    el.addEventListener("animationend", function onEnd() {
      el.classList.remove("week-anim");
      el.removeEventListener("animationend", onEnd);
    });
  }

  function changeDay(delta) {
    setViewDate(addDays(viewDate, delta));
    render();
    animateWeekSwitch(delta);
  }

  function finishSwipe() {
    if (swipe.decided) changeDay(swipe.dx < 0 ? 1 : -1);
    resetSwipe();
  }

  function onTouchStartSwipe(e) {
    if (e.touches.length !== 1) { resetSwipe(); return; }
    var t = e.touches[0];
    if (!canStartSwipe(t.clientX, e.target)) { resetSwipe(); return; }
    swipe.active = true;
    swipe.decided = false;
    swipe.startX = t.clientX;
    swipe.startY = t.clientY;
  }

  function onTouchMoveSwipe(e) {
    if (!swipe.active || e.touches.length !== 1) return;
    var t = e.touches[0];
    var decided = trackSwipeMove(t.clientX, t.clientY);
    if (decided && e.cancelable) e.preventDefault();
  }

  function onTouchEndSwipe() {
    if (!swipe.active) return;
    finishSwipe();
  }

  function onTouchCancelSwipe() { resetSwipe(); }

  function onPointerDownSwipe(e) {
    if (e.pointerType === "touch") return;
    if (!canStartSwipe(e.clientX, e.target)) { resetSwipe(); return; }
    swipe.active = true;
    swipe.decided = false;
    swipe.pointerId = e.pointerId;
    swipe.startX = e.clientX;
    swipe.startY = e.clientY;
  }

  function onPointerMoveSwipe(e) {
    if (!swipe.active || swipe.pointerId !== e.pointerId) return;
    var decided = trackSwipeMove(e.clientX, e.clientY);
    if (decided && e.cancelable) e.preventDefault();
  }

  function onPointerUpSwipe(e) {
    if (!swipe.active || swipe.pointerId !== e.pointerId) return;
    finishSwipe();
  }

  function onPointerCancelSwipe(e) {
    if (!swipe.active || swipe.pointerId !== e.pointerId) return;
    resetSwipe();
  }


  function habitItemEls() {
    return Array.prototype.slice.call(document.querySelectorAll("#page-habits .habit-item"));
  }

  function clearHabitDragTimer() {
    if (habitDrag.timer) {
      clearTimeout(habitDrag.timer);
      habitDrag.timer = null;
    }
  }

  function stopHabitAutoScroll() {
    if (habitDrag.raf) {
      cancelAnimationFrame(habitDrag.raf);
      habitDrag.raf = 0;
    }
  }

  function resetHabitDragFlags() {
    clearHabitDragTimer();
    stopHabitAutoScroll();
    if (habitDrag.row && habitDrag.row.parentNode) habitDrag.row.parentNode.removeChild(habitDrag.row);
    if (habitDrag.placeholder && habitDrag.placeholder.parentNode) habitDrag.placeholder.parentNode.removeChild(habitDrag.placeholder);
    habitDrag.active = false;
    habitDrag.pending = false;
    habitDrag.id = null;
    habitDrag.row = null;
    habitDrag.list = null;
    habitDrag.placeholder = null;
    habitDrag.pointerId = null;
    habitDrag.useTouch = false;
    document.documentElement.classList.remove("habit-dragging");
  }

  function armClickSuppress() {
    habitDrag.suppressClick = true;
    if (habitDrag.suppressTimer) clearTimeout(habitDrag.suppressTimer);
    habitDrag.suppressTimer = setTimeout(function () {
      habitDrag.suppressClick = false;
      habitDrag.suppressTimer = null;
    }, 80);
  }

  function canStartHabitDrag(target) {
    if (tab !== "habits") return false;
    if (sheetMode !== null) return false;
    var overlay = document.getElementById("overlay");
    if (overlay && overlay.classList.contains("show")) return false;
    if (state.habits.length < 2) return false;
    if (!target || !target.closest) return false;
    if (target.closest(".edit-btn") || target.closest('[data-act="add-habit"]')) return false;
    return !!target.closest("#page-habits .habit-item");
  }

  function isHabitHandle(target) {
    return !!(target && target.closest && target.closest("#page-habits .drag-handle"));
  }

  function habitPlaceholderIndex() {
    if (!habitDrag.list || !habitDrag.placeholder) return habitDrag.from;
    var kids = habitDrag.list.children;
    var idx = 0;
    for (var i = 0; i < kids.length; i++) {
      if (kids[i] === habitDrag.placeholder) return idx;
      if (kids[i].classList.contains("habit-item") || kids[i].classList.contains("habit-placeholder")) idx += 1;
    }
    return habitDrag.from;
  }

  function placeHabitPlaceholder(clientY) {
    var list = habitDrag.list;
    if (!list || !habitDrag.placeholder) return;
    var nodes = Array.prototype.slice.call(list.children);
    var before = null;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n === habitDrag.placeholder || n === habitDrag.row) continue;
      if (!n.classList.contains("habit-item")) continue;
      var r = n.getBoundingClientRect();
      if (clientY < r.top + r.height / 2) {
        before = n;
        break;
      }
    }
    if (before) {
      if (habitDrag.placeholder.nextElementSibling !== before) list.insertBefore(habitDrag.placeholder, before);
    } else if (list.lastElementChild !== habitDrag.placeholder) {
      list.appendChild(habitDrag.placeholder);
    }
    habitDrag.to = habitPlaceholderIndex();
  }

  function positionDragRow(clientY) {
    if (!habitDrag.row) return;
    habitDrag.row.style.top = (clientY - habitDrag.grabOffsetY) + "px";
  }

  function habitDragAutoScroll() {
    habitDrag.raf = 0;
    if (!habitDrag.active) return;
    var y = habitDrag.lastY;
    var vh = window.innerHeight;
    var topZone = 72;
    var bottomZone = 112;
    var speed = 0;
    if (y < topZone) speed = -Math.min(18, Math.ceil((topZone - y) / 4) + 4);
    else if (y > vh - bottomZone) speed = Math.min(18, Math.ceil((y - (vh - bottomZone)) / 4) + 4);
    if (speed) {
      window.scrollBy(0, speed);
      positionDragRow(y);
      placeHabitPlaceholder(y);
      habitDrag.raf = requestAnimationFrame(habitDragAutoScroll);
    }
  }

  function startHabitDrag(x, y) {
    clearHabitDragTimer();
    var items = habitItemEls();
    var row = null;
    var from = -1;
    items.forEach(function (el, i) {
      if (el.getAttribute("data-id") === habitDrag.id) {
        row = el;
        from = i;
      }
    });
    if (!row || from < 0) {
      resetHabitDragFlags();
      return;
    }
    var list = row.parentNode;
    var rect = row.getBoundingClientRect();
    var placeholder = document.createElement("div");
    placeholder.className = "row habit-placeholder";
    placeholder.style.height = rect.height + "px";
    placeholder.setAttribute("aria-hidden", "true");
    list.insertBefore(placeholder, row);

    habitDrag.active = true;
    habitDrag.pending = false;
    habitDrag.from = from;
    habitDrag.to = from;
    habitDrag.grabOffsetY = y - rect.top;
    habitDrag.lastX = x;
    habitDrag.lastY = y;
    habitDrag.row = row;
    habitDrag.list = list;
    habitDrag.placeholder = placeholder;
    document.documentElement.classList.add("habit-dragging");

    row.classList.add("is-dragging");
    row.style.position = "fixed";
    row.style.left = rect.left + "px";
    row.style.width = rect.width + "px";
    row.style.top = rect.top + "px";
    row.style.zIndex = "40";
    row.style.margin = "0";
    row.style.pointerEvents = "none";
    document.getElementById("app").appendChild(row);
  }

  function beginHabitPress(x, y, target, opts) {
    var row = target.closest(".habit-item");
    if (!row) return;
    clearHabitDragTimer();
    habitDrag.pending = true;
    habitDrag.active = false;
    habitDrag.id = row.getAttribute("data-id");
    habitDrag.startX = x;
    habitDrag.startY = y;
    habitDrag.lastX = x;
    habitDrag.lastY = y;
    habitDrag.pointerId = opts.pointerId;
    habitDrag.useTouch = opts.useTouch;
    if (isHabitHandle(target)) {
      startHabitDrag(x, y);
    } else {
      habitDrag.timer = setTimeout(function () {
        habitDrag.timer = null;
        if (!habitDrag.pending || habitDrag.active) return;
        startHabitDrag(habitDrag.lastX, habitDrag.lastY);
      }, 250);
    }
  }

  function onHabitMove(x, y) {
    habitDrag.lastX = x;
    habitDrag.lastY = y;
    if (habitDrag.pending && !habitDrag.active) {
      if (Math.abs(x - habitDrag.startX) > 10 || Math.abs(y - habitDrag.startY) > 10) {
        resetHabitDragFlags();
      }
      return;
    }
    if (!habitDrag.active) return;
    positionDragRow(y);
    placeHabitPlaceholder(y);
    if (!habitDrag.raf) habitDrag.raf = requestAnimationFrame(habitDragAutoScroll);
  }

  function reorderHabits(from, to) {
    if (from === to || from < 0 || to < 0 || from >= state.habits.length || to >= state.habits.length) return false;
    var item = state.habits.splice(from, 1)[0];
    state.habits.splice(to, 0, item);
    state.habits.forEach(function (h, i) { h.order = i; });
    saveState();
    return true;
  }

  function finishHabitDrag() {
    if (!habitDrag.active) {
      resetHabitDragFlags();
      return;
    }
    var from = habitDrag.from;
    var to = habitPlaceholderIndex();
    resetHabitDragFlags();
    armClickSuppress();
    reorderHabits(from, to);
    render();
  }

  function cancelHabitDrag() {
    if (!habitDrag.active && !habitDrag.pending) return;
    resetHabitDragFlags();
    armClickSuppress();
    render();
  }

  function onTouchStartHabit(e) {
    if (e.touches.length !== 1) {
      if (habitDrag.active) cancelHabitDrag();
      else resetHabitDragFlags();
      return;
    }
    if (!canStartHabitDrag(e.target)) return;
    var t = e.touches[0];
    beginHabitPress(t.clientX, t.clientY, e.target, { pointerId: null, useTouch: true });
    if (habitDrag.active && e.cancelable) e.preventDefault();
  }

  function onTouchMoveHabit(e) {
    if (!habitDrag.pending && !habitDrag.active) return;
    if (e.touches.length !== 1) return;
    var t = e.touches[0];
    onHabitMove(t.clientX, t.clientY);
    if (habitDrag.active && e.cancelable) e.preventDefault();
  }

  function onTouchEndHabit() {
    if (habitDrag.active) finishHabitDrag();
    else if (habitDrag.pending) resetHabitDragFlags();
  }

  function onTouchCancelHabit() {
    if (habitDrag.active || habitDrag.pending) cancelHabitDrag();
  }

  function onPointerDownHabit(e) {
    if (e.pointerType === "touch") return;
    if (!canStartHabitDrag(e.target)) return;
    beginHabitPress(e.clientX, e.clientY, e.target, { pointerId: e.pointerId, useTouch: false });
    if (habitDrag.active && e.cancelable) e.preventDefault();
  }

  function onPointerMoveHabit(e) {
    if (habitDrag.useTouch) return;
    if (!habitDrag.pending && !habitDrag.active) return;
    if (habitDrag.pointerId != null && habitDrag.pointerId !== e.pointerId) return;
    onHabitMove(e.clientX, e.clientY);
    if (habitDrag.active && e.cancelable) e.preventDefault();
  }

  function onPointerUpHabit(e) {
    if (habitDrag.useTouch) return;
    if (habitDrag.pointerId != null && habitDrag.pointerId !== e.pointerId) return;
    if (habitDrag.active) finishHabitDrag();
    else if (habitDrag.pending) resetHabitDragFlags();
  }

  function onPointerCancelHabit(e) {
    if (habitDrag.useTouch) return;
    if (habitDrag.pointerId != null && habitDrag.pointerId !== e.pointerId) return;
    if (habitDrag.active || habitDrag.pending) cancelHabitDrag();
  }

  document.addEventListener("contextmenu", function (e) {
    if (habitDrag.active || habitDrag.pending) e.preventDefault();
    else if (e.target && e.target.closest && e.target.closest(".drag-handle")) e.preventDefault();
  });

  document.addEventListener("touchstart", onTouchStartHabit, { passive: false });
  document.addEventListener("touchmove", onTouchMoveHabit, { passive: false });
  document.addEventListener("touchend", onTouchEndHabit, { passive: true });
  document.addEventListener("touchcancel", onTouchCancelHabit, { passive: true });
  document.addEventListener("pointerdown", onPointerDownHabit);
  document.addEventListener("pointermove", onPointerMoveHabit, { passive: false });
  document.addEventListener("pointerup", onPointerUpHabit);
  document.addEventListener("pointercancel", onPointerCancelHabit);

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && (habitDrag.active || habitDrag.pending)) cancelHabitDrag();
  });
  window.addEventListener("pagehide", function () {
    if (habitDrag.active || habitDrag.pending) cancelHabitDrag();
  });

  document.addEventListener("touchstart", onTouchStartSwipe, { passive: true });
  document.addEventListener("touchmove", onTouchMoveSwipe, { passive: false });
  document.addEventListener("touchend", onTouchEndSwipe, { passive: true });
  document.addEventListener("touchcancel", onTouchCancelSwipe, { passive: true });
  document.addEventListener("pointerdown", onPointerDownSwipe);
  document.addEventListener("pointermove", onPointerMoveSwipe, { passive: false });
  document.addEventListener("pointerup", onPointerUpSwipe);
  document.addEventListener("pointercancel", onPointerCancelSwipe);

  document.addEventListener("click", onClick);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && sheetMode) { closeSheet(); }
    if (e.key === "Enter" && sheetMode === "habit" && !e.isComposing) {
      if (document.activeElement && document.activeElement.id === "habitName") {
        e.preventDefault();
        saveHabit();
      }
    }
  });
  document.getElementById("overlay").addEventListener("click", function (e) {
    if (e.target.id === "overlay") closeSheet();
  });

  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  }

  applyTheme();
  setupViewport();
  render();

  fetch("./data.json", { cache: "no-store" }).then(function (res) {
    if (!res.ok) throw new Error("data.json HTTP " + res.status);
    return res.json();
  }).then(function (d) {
    DATA = d || DATA;
    dataError = "";
    render();
  }).catch(function () {
    dataError = "予定と課題の一覧（data.json）を読み込めませんでした。習慣の記録はこの端末に残っています。";
    render();
  });

  if (navigator.serviceWorker && location.protocol !== "file:") {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  }
})();
  </script>
</body>
